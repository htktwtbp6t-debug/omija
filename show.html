<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>발표 화면 · 오미자 음료 개발</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/show.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="ctl" id="ctl">
  <button data-a="prev" title="이전 (←)">‹</button>
  <button data-a="next" title="다음 (→)">›</button>
  <button data-a="qr" title="학생 QR (Q)">QR</button>
  <button data-a="remote" title="리모컨 QR (R)">리모컨</button>
  <button data-a="fs" title="전체 화면 (F)">⛶</button>
</div>
<script type="module" src="js/show.js"></script>
</body>
</html>
