<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>리모컨 · 오미자 음료 개발</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
body{padding-bottom:84px}
.rm{max-width:560px;margin:0 auto;padding:12px 14px}
.rm-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.rm-head b{font-family:var(--disp);font-weight:400;font-size:1.3rem}
.now{border:var(--bd);border-radius:14px;background:#fff;box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.now .t{font-weight:800;font-size:1.15rem}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:14px}
.nav .btn{font-size:1.4rem;padding:.8em 0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px;z-index:10}
.tabs button{color:var(--cream);font-weight:800;border-radius:10px;padding:10px 0;font-size:.95rem}
.tabs button.on{background:var(--g2);color:var(--ink)}
.sec h3{font-family:var(--disp);font-weight:400;font-size:1.3rem;margin:14px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px;margin-bottom:6px;font-weight:700}
.row .num{font-size:1.1rem}
.row.on{background:#E3F7EE}
.row.ab{background:var(--dim);color:#8a8279}
.row select{border:2px solid var(--ink);border-radius:8px;padding:4px;background:#fff;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#ccc;display:inline-block;margin-right:6px;border:1.5px solid var(--ink)}
.dot.on{background:var(--g3)}
.slist button{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px;margin-bottom:6px;font-weight:700}
.slist button.cur{background:var(--g2)}
.cupcard{border:var(--bd);border-radius:14px;background:#fff;padding:12px;margin-bottom:10px}
.cupcard.made{background:#E3F7EE}
.cupcard .cn{font-family:var(--num);font-weight:700;font-size:2rem}
.cupcard .ings{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cupcard .ings span{border:2px solid var(--ink);border-radius:8px;text-align:center;padding:4px 0;font-size:.8rem;font-weight:700;background:var(--c)}
.cupcard .ings b{display:block;font-family:var(--num);font-size:1.25rem}
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:12px}
.seg button{padding:8px 0;font-weight:800}
.seg button.on{background:var(--ink);color:var(--cream)}
.ingblock{border:var(--bd);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
.ingblock .h{background:var(--c);border-bottom:var(--bd);padding:6px 12px;font-weight:800}
.ingblock .b{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px}
.ingblock .b span{border:2px solid var(--ink);border-radius:8px;padding:2px 8px;font-family:var(--num);font-weight:700}
.mini{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--cream);padding:6px 0 10px;margin-bottom:4px;border-bottom:2px solid var(--line)}
.mini span{font-weight:700;font-size:.9rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini button{border:var(--bd);border-radius:12px;background:#fff;font-weight:800;padding:10px 14px;box-shadow:3px 3px 0 var(--ink)}
.mini button.nx{background:var(--accent);color:#fff}
.mini button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.gst{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<main id="main" class="rm"><div class="center"><span class="spin"></span></div></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="go">진행</button><button data-tab="att">출석</button><button data-tab="grp">모둠</button><button data-tab="taste">시음</button><button data-tab="end">마무리</button>
</nav>
<script type="module" src="js/remote.js"></script>
</body>
</html>
